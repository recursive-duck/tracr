# Parameters for experiment scripts under experiments/.

[shrink_report]
programs = ["length", "reverse", "hist", "sort_unique", "sort", "sort_freq",
            "frac_prevs", "pair_balance", "shuffle_dyck2", "count_less_freq"]
vocab_sizes = [4, 8, 16, 32]
max_seq_lens = [4, 8, 16, 32]
compiler_bos = "BOS"
# String-vocab programs use these tokens, padded with a0, a1, ... up to V.
dyck_tokens = ["(", ")", "{", "}"]
workers = 8
timeout_s = 900
# Every input is checked when sum_{n=1..N} V^n is at most this.
exhaustive_limit = 2000
# Otherwise this many random sequences, lengths uniform in 1..N.
samples = 256
seed = 0
batch_size = 32
# A categorical position is a tie when the original's top-2 output scores are
# closer than this; its argmax is then set by rounding. sort_freq at N=32 has
# ties up to 1.34e-06 that flip, and decided positions far above this.
tie_tol = 1e-5
# Decoded outputs are also checked against RASP (rasp.fast_eval). A numerical
# output matches when |output - RASP| <= rasp_atol + rasp_rtol * |RASP|.
# float32 originals are within 4.4e-08 of RASP on frac_prevs and pair_balance
# (V=8, N=32); the smallest real gap between fractions at N=32 is about 1e-3.
rasp_atol = 1e-6
rasp_rtol = 0.0
# Configs with at least this many dense params start first.
heavy_params = 100_000_000
out_dir = "experiments/shrink_report"

[pack_report]
# Packs the first K programs, K = 1..len(programs), in this order. Inputs
# (vocab tokens, exhaustive limit, samples, seed) follow [shrink_report].
programs = ["length", "reverse", "hist", "sort_unique", "sort", "sort_freq",
            "frac_prevs", "pair_balance", "shuffle_dyck2", "count_less_freq"]
vocab_sizes = [4, 8, 16, 32]
max_seq_lens = [4, 8, 16, 32]
compiler_bos = "BOS"
# One process per (V, N); an N=32 one holds about 4 GB of dense weights and
# peaks near 8 GB while compiling shuffle_dyck2.
workers = 8
timeout_s = 3600
# MLP gate weight per unit: gate_scale * bound on its input + gate_offset.
gate_scale = 2.0
gate_offset = 1.0
# Bound categorical dims by [0, 1] when sizing gates.
onehot_bounds = true
# Balance each unit's input and output weights by a power of 2 (exact).
rebalance = true
ilp_time_limit_s = 5.0
ilp_max_nonzeros = 20_000_000
batch_size = 32
tie_tol = 1e-5
# Configs with this max_seq_len start first, at most heavy_workers at once
# (about 12 GB each).
heavy_n = 32
heavy_workers = 3
out_dir = "experiments/pack_report"

[bitsplit_compare]
# lib.make_sort / make_sort_freq ("lib") against the bit-split programs in
# tracr/compiler/lib_bits.py, with the per-level counts summed numerically
# ("bits_num") or by categorical SequenceMaps ("bits_cat").
programs = ["sort", "sort_freq"]
forms = ["lib", "bits_num", "bits_cat"]
# [vocab size V, max_seq_len N]; tokens are 0 .. V - 1.
configs = [[32, 8], [64, 8], [128, 8], [256, 8], [16, 16], [32, 32]]
# Random inputs per config, lengths uniform in 1..N; compiled outputs are
# compared with rasp.evaluate of the same program, and the bit-split RASP
# outputs with the lib program's.
samples = 200
seed = 0
compiler_bos = "BOS"
# One process per (program, form, V, N); other jobs share the laptop.
workers = 3
timeout_s = 1800
out_dir = "experiments/bitsplit_compare"

[bit_encoding]
# One-hot vs binary tokens/indices (and every S-Op) on EQ-based programs.
programs = ["agg_eq", "map_lookup", "hist"]
encodings = ["categorical", "binary"]
# V = N for every size.
sizes = [256, 1_024, 4_096]
# Random inputs per config, lengths uniform in 1..N.
samples = 200
seed = 0
compiler_bos = "BOS"
# A size is dropped only if its compile does not finish in this time.
compile_timeout_s = 600
# Hard limit for one child (compile + shrink + evaluation).
child_timeout_s = 3600
# Processes computing the RASP reference outputs.
rasp_workers = 3
out_dir = "experiments/bit_encoding"

[bit_arith]
# a + b of two w-bit numbers (a = tokens, b = indices, max_seq_len 2^w) as
# one lookup-table SequenceMap vs lib_arith bit circuits. The lookup chain
# runs widths in order and stops at its first failure.
widths = [2, 3, 4, 5, 6, 7, 8, 9, 10]
methods = ["ripple_kpg", "ripple_pair", "ripple_bits", "kogge_stone"]
compiler_bos = "BOS"
# Random full-length inputs per config, seeded with seed + w, run through
# the dense compiled model: `samples` of them, but at most
# dense_token_budget tokens in all (200 up to w=9, 102 at w=10).
samples = 200
dense_token_budget = 105_000
seed = 0
batch_size = 8
# One process per (method, w), killed after timeout_s for a lookup table
# (the 5 min limit: the chain stops there) and bit_timeout_s for a circuit.
timeout_s = 300
bit_timeout_s = 1200
workers = 3
# Skip a lookup width whose dense MLP weights (4^w units x 2 x d_model x
# bytes_per_param, d_model ~ 2^(w+2)) exceed this many GB.
mem_budget_gb = 16
bytes_per_param = 4
# Ratios at least this large are bold in summary.md.
bold_ratio = 3.0
out_dir = "experiments/bit_arith"

[fast_eval_bench]
# rasp.evaluate vs rasp.fast_eval.evaluate_batch, inputs per second.
programs = ["sort", "hist"]
seq_lens = [8, 32, 128, 512]
vocab_size = 32
# fast_eval batch: about this many selector entries (batch * N * N), capped.
batch_elements = 16_777_216
max_batch = 4096
# Each timing repeats until at least this long, and runs at least min_reps.
min_time_s = 2.0
min_reps = 3
seed = 0
out_dir = "experiments/fast_eval_bench"
