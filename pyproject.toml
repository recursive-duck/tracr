[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tracr"
version = "1.0.0"
description = "Compiler from RASP to transformer weights"
authors = [{name = "DeepMind LMI team", email = "tracr-devs@google.com"}]
urls = {Homepage = "https://github.com/deepmind/tracr"}
# 3.11 is the floor: chex==0.1.92, the oldest version the tests were run on,
# requires Python>=3.11. validating.py also needs 3.10+ for `X | None`.
requires-python = ">=3.11"
dependencies = [
    "chex>=0.1.92,<0.2",
    "dm-haiku>=0.0.17,<0.1",
    "einops>=0.8.2,<0.9",
    "jax>=0.10.2,<0.11",
    "networkx>=3.6.1,<4",
    "numpy>=2.4.6,<3",
    "typing_extensions>=4.16.0,<5",
]

[project.optional-dependencies]
test = [
    "absl-py>=2.5.1,<3",
    "pytest>=9.2.0,<10",
    "pytest-xdist>=3.8.0,<4",
]
experiments = [
    "matplotlib>=3.10.0,<4",
]

[tool.uv]
# Direct dependencies resolve to their lower bounds, which are the versions the
# tests were run on. Transitive dependencies still resolve to the newest
# compatible release.
resolution = "lowest-direct"

[tool.setuptools.packages.find]
# Same packages as the former setup.py `find_packages()`: every directory under
# tracr/ with an __init__.py. Namespace-package discovery stays off to match it.
include = ["tracr", "tracr.*"]
namespaces = false
